name: Deploy to Hostinger

# Runs on every push to main, and can also be triggered by hand from the
# GitHub UI (Actions -> Deploy to Hostinger -> Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Every run of this workflow has failed inside the SSH step with nothing
      # but "exit code 1", which says nothing about the cause. These checks run
      # first and report what is actually wrong as annotations, which are
      # readable without repository admin rights.
      - name: Preflight — required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY APP_DIR PM2_APP_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is not set in repository secrets"
              missing="$missing $name"
            else
              echo "$name is set (${#name} char name, value hidden)"
            fi
          done
          # Optional ones: report but do not fail.
          [ -z "$SSH_PORT" ] && echo "::notice::SSH_PORT not set, defaulting to 22"
          [ -z "$SITE_URL" ] && echo "::notice::SITE_URL not set, the verify step will be skipped"
          [ -z "$WEB_ROOT" ] && echo "::notice::WEB_ROOT not set — the deploy will ask nginx which directory serves the site"

          if [ -n "$missing" ]; then
            echo "::error title=Deploy cannot start::Set the missing secrets under Settings -> Secrets and variables -> Actions:$missing"
            exit 1
          fi

          # The key may be pasted either as the PEM block or, because selecting a
          # multi-line block in a web terminal is error-prone, as a single base64
          # line. Accept both and say which arrived.
          if printf '%s' "$SSH_KEY" | grep -q -- "-----BEGIN"; then
            echo "SSH_KEY arrived as a PEM block."
            if ! printf '%s' "$SSH_KEY" | grep -q -- "-----END"; then
              echo "::error title=SSH_KEY is truncated::A -----BEGIN line is present but the matching -----END line is missing, so only part of the key was pasted."
              exit 1
            fi
          elif printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d 2>/dev/null | grep -q -- "-----BEGIN"; then
            echo "SSH_KEY arrived base64-encoded and decodes to a private key."
          elif printf '%s' "$SSH_KEY" | grep -qE '^[[:space:]]*(ssh-(rsa|ed25519)|ecdsa-sha2)'; then
            echo "::error title=SSH_KEY is a public key::This is the .pub file. Use the private key — the file without the .pub extension."
            exit 1
          else
            echo "::error title=SSH_KEY is not a usable key::The value is neither a -----BEGIN block nor base64 that decodes to one. Run the one-line command from the deploy notes and paste its single line of output."
            exit 1
          fi

      - name: Preflight — can we reach the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          port="${SSH_PORT:-22}"
          # A single probe is not evidence: this check has both passed and failed
          # against the same reachable host, so give a transient hiccup room to
          # clear before calling the server unreachable.
          for attempt in 1 2 3 4 5; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/$port" 2>/dev/null; then
              echo "TCP connect to the SSH port succeeded on attempt $attempt."
              exit 0
            fi
            echo "attempt $attempt could not connect; retrying"
            sleep 6
          done
          echo "::error title=Cannot reach the SSH port::Five attempts over ~40s could not open a TCP connection to the host on port $port. Check SSH_HOST, SSH_PORT, and whether the server firewall or fail2ban is blocking GitHub's runners."
          exit 1

      # Copying a key out of a terminal often picks up a leading blank line or
      # carriage returns. Those are cosmetic, but ssh rejects the key over them,
      # so normalise the value rather than making someone re-paste it perfectly.
      - name: Normalise the SSH key
        id: key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # A single base64 line is the easiest thing to copy out of a web
          # terminal correctly, so decode that form first. Otherwise take the
          # block between BEGIN and END, since copying multi-line output easily
          # picks up a surrounding banner or the shell prompt and ssh rejects the
          # key over anything extra.
          if printf '%s' "$SSH_KEY" | grep -q -- "-----BEGIN"; then
            clean=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed -n '/-----BEGIN/,/-----END/p')
          else
            clean=$(printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d 2>/dev/null)
          fi
          [ -n "$clean" ] || clean=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed '/./,$!d')
          # Keep it out of the log: write to the step output via a file.
          {
            echo 'value<<SSH_KEY_EOF'
            printf '%s\n' "$clean"
            echo 'SSH_KEY_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$clean"
          echo "normalised to $(printf '%s\n' "$clean" | grep -c '') lines"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ steps.key.outputs.value }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            WEB_ROOT="${{ secrets.WEB_ROOT }}"
            PM2_APP="${{ secrets.PM2_APP_NAME }}"

            # The action prints this script's output on the runner's stdout, and
            # the runner turns ::error:: lines into annotations. Emitting one is
            # what makes a server-side failure readable without log access.
            fail() { echo "::error title=Deploy failed on the server::$1"; exit 1; }
            note() { echo "::notice::$1"; }

            # Report whatever aborts the script, including a command that fails
            # outside an explicit check.
            trap 'rc=$?; [ $rc -ne 0 ] && echo "::error title=Deploy aborted::The deploy script exited with status $rc. Last stage: $STAGE"' EXIT
            STAGE="starting"

            # node here is installed through nvm, which puts itself on PATH from
            # ~/.bashrc — and that is only read by interactive shells. An SSH
            # command session is not interactive, so node, npm and pm2 are all
            # missing unless nvm is loaded explicitly.
            STAGE="Loading the node environment"
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # nvm.sh is not written to survive `set -e`/unset-variable checks.
              set +e
              . "$NVM_DIR/nvm.sh" --no-use >/dev/null 2>&1
              nvm use --lts >/dev/null 2>&1 || nvm use default >/dev/null 2>&1 || true
              set -e
            fi
            # Fall back to whatever node versions nvm has on disk, plus the usual
            # system locations, so a missing or unusual nvm setup is survivable.
            for d in "$NVM_DIR"/versions/node/*/bin /usr/local/bin /usr/bin; do
              [ -d "$d" ] && PATH="$d:$PATH"
            done
            export PATH

            STAGE="Checking the server is set up as expected"
            echo "==> Checking the server is set up as expected"
            [ -d "$APP_DIR" ]      || fail "APP_DIR '$APP_DIR' does not exist on the server"
            [ -d "$APP_DIR/.git" ] || fail "APP_DIR '$APP_DIR' is not a git clone"

            # Where the site is served from is something nginx already knows, so
            # ask it rather than making someone dig the path out by hand. An
            # explicit WEB_ROOT still wins if one is configured.
            if [ -z "$WEB_ROOT" ]; then
              ROOTS=$(nginx -T 2>/dev/null \
                | awk '$1 == "root" { gsub(/;/, "", $2); print $2 }' \
                | grep -v 'example\.com' | sort -u)
              [ -n "$ROOTS" ] || fail "Could not work out the web root from nginx. Set a WEB_ROOT secret."
              echo "    nginx roots: $(echo $ROOTS)"

              # Several server blocks can declare a root, and the default one is
              # not the site. Prefer the root that is the app's own build output,
              # then any root that already holds a built bundle, before falling
              # back to the first — picking blindly published to the wrong place.
              DIST="$APP_DIR/web/dist"
              WEB_ROOT=""
              for r in $ROOTS; do
                if [ "$(readlink -f "$r" 2>/dev/null)" = "$(readlink -f "$DIST" 2>/dev/null)" ]; then
                  WEB_ROOT="$r"; echo "    chose '$r' — it is the build directory"; break
                fi
              done
              if [ -z "$WEB_ROOT" ]; then
                for r in $ROOTS; do
                  if ls "$r"/assets/index-*.js >/dev/null 2>&1; then
                    WEB_ROOT="$r"; echo "    chose '$r' — it already serves a built bundle"; break
                  fi
                done
              fi
              if [ -z "$WEB_ROOT" ]; then
                WEB_ROOT=$(echo "$ROOTS" | head -1)
                echo "    no root looked like the site; falling back to '$WEB_ROOT'"
              fi
            else
              echo "    using configured WEB_ROOT: $WEB_ROOT"
            fi

            [ -d "$WEB_ROOT" ]     || fail "WEB_ROOT '$WEB_ROOT' does not exist on the server"
            [ -w "$WEB_ROOT" ]     || fail "WEB_ROOT '$WEB_ROOT' is not writable by $(whoami)"
            command -v node >/dev/null || fail "node is still not on PATH after loading nvm from $NVM_DIR. Checked: $NVM_DIR/versions/node/*/bin, /usr/local/bin, /usr/bin"
            command -v npm  >/dev/null || fail "npm is not on PATH even though node is at $(command -v node)"
            command -v pm2  >/dev/null || fail "pm2 is not on PATH even though node is at $(command -v node). Install it globally, or add its bin directory."
            echo "    node $(node -v), npm $(npm -v), pm2 $(pm2 -v | tail -1)"

            pm2 describe "$PM2_APP" >/dev/null 2>&1 \
              || fail "pm2 has no process named '$PM2_APP'. Existing: $(pm2 jlist | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).map(p=>p.name).join(", ")||"(none)")}catch(e){console.log("(could not read pm2 list)")}})')"

            STAGE="Pulling latest code"
            echo "==> Pulling latest code"
            cd "$APP_DIR"
            git fetch --all --prune
            # A server left on a detached HEAD cannot fast-forward; pin it back
            # onto main so the deploy is repeatable.
            git checkout -B main origin/main
            git reset --hard origin/main
            echo "    now at $(git rev-parse --short HEAD)"

            STAGE="Building backend"
            echo "==> Building backend"
            cd "$APP_DIR/backend"
            npm ci
            npx prisma generate
            npm run build

            STAGE="Restarting backend (pm2)"
            echo "==> Restarting backend (pm2)"
            pm2 restart "$PM2_APP" --update-env

            STAGE="Building web"
            echo "==> Building web"
            cd "$APP_DIR/web"
            npm ci
            npm run build

            STAGE="Publishing web to $WEB_ROOT"
            echo "==> Publishing web to $WEB_ROOT"
            # nginx may already point straight at the build directory, in which
            # case copying it onto itself would be pointless and could clobber
            # files mid-read. Only copy when the two are genuinely different.
            DIST="$APP_DIR/web/dist"
            if [ "$(readlink -f "$WEB_ROOT")" = "$(readlink -f "$DIST")" ]; then
              echo "    web root is the build directory itself — nothing to copy"
            else
              cp -r "$DIST/." "$WEB_ROOT/"
              echo "    copied $DIST -> $WEB_ROOT"
            fi

            # The Android build ships in the repo because the server cannot
            # build an APK; make sure the download the website links to is the
            # real file and not a stale or missing one.
            STAGE="Publishing the Android build"
            echo "==> Publishing the Android build"
            APK_SRC="$APP_DIR/web/public/downloads"
            if ls "$APK_SRC"/*.apk >/dev/null 2>&1; then
              mkdir -p "$WEB_ROOT/downloads" "$APP_DIR/backend/public/downloads"
              cp -f "$APK_SRC"/*.apk "$WEB_ROOT/downloads/" \
                || fail "Could not copy the APK into '$WEB_ROOT/downloads'"
              cp -f "$APK_SRC"/*.apk "$APP_DIR/backend/public/downloads/" \
                || fail "Could not copy the APK into the backend downloads directory"
              echo "    published $(ls -1 "$APK_SRC"/*.apk | wc -l) APK file(s):"
              ls -lh "$WEB_ROOT/downloads"/*.apk | awk '{print "      " $9 " " $5}'
            else
              fail "No APK in '$APK_SRC'. The published build ships in the repo, so the website has nothing to serve — check that the file was committed and that the server's checkout is current."
            fi

            STAGE="Deploy complete"
            echo "==> Deploy complete"

      - name: Verify live deployment
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # The secrets context is not available to step-level `if`, so the
          # skip is decided here instead.
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set — skipping live verification."
            exit 0
          fi
          sleep 5

          echo "--- backend Google auth config ---"
          # 401 INVALID_GOOGLE_TOKEN = configured correctly.
          # 503 GOOGLE_AUTH_NOT_CONFIGURED = env vars still missing on the server.
          curl -s -o /tmp/g.json -w "HTTP %{http_code}\n" \
            -X POST "$SITE_URL/api/v1/auth/google" \
            -H "Content-Type: application/json" \
            -d '{"credential":"probe.invalid"}' || true
          cat /tmp/g.json || true
          echo

          echo "--- served web bundle ---"
          curl -s "$SITE_URL/" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true

          echo "--- published Android build ---"
          info=$(curl -s "$SITE_URL/api/v1/downloads/android/info" || true)
          echo "$info"
          name=$(printf '%s' "$info" | grep -oE '"fileName":"[^"]+"' | cut -d'"' -f4)
          want=$(printf '%s' "$info" | grep -oE '"sha256":"[a-f0-9]+"' | cut -d'"' -f4)
          if [ -n "$name" ]; then
            curl -s -o /tmp/app.apk "$SITE_URL/downloads/$name" || true
            size=$(wc -c < /tmp/app.apk 2>/dev/null || echo 0)
            got=$(sha256sum /tmp/app.apk 2>/dev/null | cut -d' ' -f1)
            echo "downloaded $name: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error title=APK download is broken::$SITE_URL/downloads/$name returned only $size bytes. The published build is missing or truncated."
              exit 1
            elif [ -n "$want" ] && [ "$got" != "$want" ]; then
              echo "::error title=APK checksum mismatch::served $got but the site advertises $want"
              exit 1
            else
              echo "APK download verified ($size bytes, sha256 matches)."
            fi
          fi
